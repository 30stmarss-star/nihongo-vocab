name: Deploy to GitHub Pages

# main 에 push하면 GitHub 공식 Pages 배포로 자동 게시한다.
# (예전엔 peaceiris로 gh-pages 브랜치에 올렸지만, 브랜치 방식 게시가 멈추는
#  문제가 있어 공식 actions/deploy-pages 방식으로 전환. 재현성·신뢰성이 높다.)
#
# ⚠️ 저장소 설정 필요(1회): Settings → Pages → Build and deployment →
#    Source 를 "GitHub Actions" 로 변경해야 이 워크플로가 게시된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않게 (마지막 push만 반영)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # anon 키·URL은 공개돼도 안전(프론트 번들에 포함되며 RLS로 보호).
          VITE_SUPABASE_URL: https://auvcrexjkoxvymzytlxp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1dmNyZXhqa294dnltenl0bHhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMTkyNDQsImV4cCI6MjA5Njg5NTI0NH0.F_BlgGokT7mwzOBfxxVPg_68SJw8ZHq2XaEqNeX5uJo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
